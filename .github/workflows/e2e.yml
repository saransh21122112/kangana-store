name: E2E (manual)

# Manual-trigger only (workflow_dispatch) — deliberately NOT on push/PR.
# This suite creates and deletes real throwaway users and reads real data
# against the live, shared production Neon database (there is no separate
# test database for this app — see testing/e2e/README.md). Run it from the
# GitHub Actions tab ("Run workflow") when you specifically want to verify
# against the real environment, not automatically on every commit.
#
# Required repo secrets (Settings → Secrets and variables → Actions):
#   DATABASE_URL, DATABASE_URL_UNPOOLED, NEXTAUTH_SECRET, NEXTAUTH_URL,
#   E2E_OWNER_EMAIL, E2E_OWNER_PASSWORD
# (E2E_OWNER_EMAIL/PASSWORD must be a real OWNER account's credentials —
# same ones used locally in .env.test.local.)
on:
  workflow_dispatch:

jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run e2e suite
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DATABASE_URL_UNPOOLED: ${{ secrets.DATABASE_URL_UNPOOLED }}
          NEXTAUTH_SECRET: ${{ secrets.NEXTAUTH_SECRET }}
          NEXTAUTH_URL: ${{ secrets.NEXTAUTH_URL }}
          E2E_OWNER_EMAIL: ${{ secrets.E2E_OWNER_EMAIL }}
          E2E_OWNER_PASSWORD: ${{ secrets.E2E_OWNER_PASSWORD }}
        run: npm run test:e2e

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
