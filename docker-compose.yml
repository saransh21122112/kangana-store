# Local Docker Desktop convenience wrapper around the Dockerfile.
#
# This project's database is Neon Postgres (provisioned via the Vercel
# Marketplace — see MEMORY.md Stage 0), the same one used in production, so
# there is no local `postgres` service here by design: `docker compose up`
# talks to the real Neon DB using whatever DATABASE_URL/DATABASE_URL_UNPOOLED
# you put in a local `.env` file (copy `.env.example` to `.env` and fill in
# real values — never commit `.env`).
#
# Usage:
#   cp .env.example .env   # then fill in real secrets
#   docker compose up --build

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
    restart: unless-stopped
